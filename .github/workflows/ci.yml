name: elda-ci-guard

# 群雄割据 CI（第三层：云端双保险）
# 每次 push 到 main 自动跑完整门禁：build → copy → chunks → sync → ci(21检查器) → smoke
# 任何一步 FAIL → 本次运行红灯；Pages 部署仍由 GitHub 默认 workflow 执行，
# 但 CI 红灯即"不可发布"的机器证据。

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  elda-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 一键门禁（build→chunks→sync→ci→smoke→四路字节）
        run: python -X utf8 skills/elda-ci-guard/scripts/ci_guard.py --build --report

      - name: 上传门禁报告
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-guard-report
          path: docs/ci_guard_report_latest.md
          if-no-files-found: ignore

      - name: 生成发布页（docs/release.html）
        if: success()
        run: python -X utf8 tools/elda/gen_release_page.py

      - name: 提交发布页回仓库（[skip ci] 防循环）
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "elda-ci-bot"
          git config user.email "elda-ci-bot@users.noreply.github.com"
          git add docs/release.html
          if git diff --cached --quiet; then
            echo "发布页无变化，跳过提交"
          else
            git commit -m "docs: 自动生成发布页 [skip ci]"
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin main
            echo "发布页已提交并推送"
          fi
