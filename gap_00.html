.v68-pop-title{ font-family:Georgia,"Times New Roman",serif; font-weight:700; letter-spacing:1px; color:var(--c-gold-600); }
.v68-pop-close{ background:none; border:1px solid var(--c-ink-700); color:var(--c-ink-900); border-radius:3px; cursor:pointer; font-size:14px; padding:1px 8px; }
.v68-pop-close:hover{ border-color:var(--c-gold-600); color:var(--c-gold-600); }
.v68-pop-body{ padding:12px 14px; }
.v68-line{ padding:4px 0; border-bottom:1px dashed rgba(74,52,32,.28); font-size:13.5px; }
.v68-sec{ margin-top:10px; font-weight:700; color:var(--c-gold-600); border-bottom:1px solid var(--c-gold-600); padding-bottom:2px; }
.v68-hint{ margin-top:12px; font-size:12px; color:#8a7a5a; font-style:italic; }
.v68-line.muted{ color:#8a7a5a; font-style:italic; }

/* /v73ui:panel/ V73 面板容器：居中弹窗 + 可读性（字号 ≥14px / 行高 1.7 / 分区徽章 / 进度条） */
.v68-panel-box{width:min(92vw,560px);max-height:82vh;overflow-y:auto;box-sizing:border-box}
.v68-panel-box h3{font-size:16px;margin:12px 0 8px;letter-spacing:1px;color:var(--c-gold-600,#8b6f47);font-weight:700}
.v68-panel-box .row{font-size:14.5px;margin:6px 0;line-height:1.7}
.v68-panel-box .mini{font-size:13.5px;line-height:1.7;margin:4px 0;color:var(--c-ink-700,#6b5a3a)}
.v68-panel-box .itemline{font-size:14px;line-height:1.7}
.v68-panel-box .p-sec{font-size:13.5px;color:var(--c-gold-600,#8b6f47);font-weight:700;margin:12px 0 2px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed rgba(74,52,32,.25);padding-bottom:3px}
.v68-panel-box .cnt{background:var(--c-parch-100,#e8dcbc);border:1px solid rgba(74,52,32,.3);border-radius:10px;padding:0 8px;font-size:12px;color:var(--c-ink-700,#6b5a3a);font-weight:600}
.v68-panel-box .p-bar{height:9px;background:rgba(74,52,32,.15);border-radius:5px;overflow:hidden;margin:6px 0 2px}
.v68-panel-box .p-fill{height:100%;background:linear-gradient(90deg,#c9a227,#e8c468);border-radius:5px;transition:width .3s}
.v68-panel-box .money{color:var(--c-gold-600,#a07020);font-weight:700}
.v68-panel-box .panel-footer{display:flex;justify-content:flex-end;padding:10px 0 0;margin-top:6px}
@media (max-width:768px){
  .v68-panel-box{width:94vw;max-height:86vh}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">艾尔达大陆 · 群雄割据</span>
    <span class="sep">|</span>
    <span class="stat" id="tb-date">4037年 · 春一月 · 一日</span>
    <span class="stat">📍<b id="tb-place">—</b></span>
    <span class="stat">金币 <b id="tb-gold">100</b></span>
    <span class="stat">第 <b id="tb-day">1</b> 日</span>
    <span class="stat" id="tb-weather" title="天气">☀️</span>
    <span class="nav">
      <span class="v68-nav-group">
        <button class="btn" id="btn-map" title="世界地图 (M)" onclick="v67_map.open()">🗺 地图</button>
        <button class="btn" id="btn-pack" title="行囊 (B)">🎒 行囊</button>
        <button class="btn" id="btn-realm" title="修炼 (T)">⚡ 修炼</button>
        <button class="btn" id="btn-log" title="日志 (L)">📜 日志</button>
      </span>
      <span class="v68-nav-sep"></span>
      <span class="v68-nav-group">
        <button class="btn" id="btn-faction" title="势力 (F)" onclick="v35_openFactionPanel()">⚜ 势力</button>
        <button class="btn" id="btn-task" title="任务与目标 (Q)">✉ 任务</button>
        <button class="btn" id="btn-strong" title="强者名册 (G)">⚔ 强者</button>
        <button class="btn" id="btn-chronicle" title="编年史 (C)">📖 编年史</button>
        <button class="btn" id="btn-save" title="存档 (Ctrl+S)" onclick="v34_openSavePanel()">💾 存档</button>
        <button class="btn" id="btn-settings" title="设置" onclick="v34_openSettings()">⚙ 设置</button>
      </span>
      <span class="v68-nav-sep"></span>
      <span class="v68-nav-group">
        <button class="btn btn-v68-mini" id="btn-ach" title="成就" onclick="v34_openAchievements()">⚑</button>
        <button class="btn btn-v68-mini" id="btn-magic" title="魔法" onclick="v35_openMagicPanel()">✦</button>
        <button class="btn btn-v68-mini" id="btn-llm" title="AI润色">✨</button>
      </span>
    </span>
    <div class="v44-topbar2">
      <div class="v44-pressure"><span class="v44-pressure-label">压力</span><div class="v44-pressure-bar"><div class="v44-pressure-fill v44-p-low" id="tb-pressure"></div></div><span class="v44-pressure-num" id="tb-pressure-num">0</span></div>
      <div class="v44-quick">
        <button class="btn" onclick="v44_quickRest()">休整</button>
        <button class="btn" onclick="saveGame()">存档</button>
        <button class="btn" onclick="v34_openSettings()">设置</button>
      </div>
    </div>
  </div>
  <div id="v68-announce" aria-label="世界纪闻"><span class='va-ic'>🌍</span><span class='va-txt muted'>世界暂无大事。太安静了，安静得让人不安。</span><span class='va-btn' onclick='V68_UI.announceOpen()'>展开</span></div>
  <div id="main">
    <div id="stage">
      <div id="story"></div>
      <div id="options"></div>
      <div id="v68-status"></div>
      <div id="ending"></div>
    </div>
    <div id="side">
      <div id="stats"></div>
      <div id="panels">
        <div id="map"></div>
        <div id="pack"></div>
        <div id="realm"></div>
        <div id="log"></div>
      </div>
    </div>
  </div>
</div>
<div id="modal"></div>
<div id="flash"></div>
